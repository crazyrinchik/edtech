name: Мониторинг прода

# Внешняя проверка живости: ходит на sovenok.space снаружи по расписанию.
#
# Почему не cron на самом сервере: проверка, живущая на проверяемой машине,
# молчит ровно тогда, когда нужна больше всего. Раннер GitHub — единственная
# инфраструктура, которая у проекта уже есть и которая не зависит от Яндекс
# Облака: если ляжет машина, сеть или Caddy, проверка это увидит.
#
# Про расписание — по замерам, а не по документации. Первые сутки работы с
# cron'ом `*/5` (288 запусков в день по заявке) GitHub выдал ВОСЕМЬ запусков:
# промежутки 103, 103, 274, 245, 246, 225 и 137 минут. То есть заявленную
# частоту он не соблюдает даже близко и большую часть тиков просто выбрасывает —
# обычное дело для расписаний в публичных репозиториях на бесплатном тарифе.
#
# Отсюда честный вывод: это НЕ пятиминутный мониторинг. Это проверка примерно
# раз в два-четыре часа, которая заметит «прод лежит со вчера» и не заметит
# получасовое падение в час пик. Расписание ниже — просьба, а не расписание.
#
# Минуты выбраны не круглые: в 0, 5, 15, 30 GitHub ставит очередь со всего мира,
# и шанс быть выброшенным там выше. Раз в десять минут вместо пяти — по той же
# причине: более скромная заявка имеет больше шансов быть исполненной, а разницы
# между 288 и 144 невыполненными заявками в день всё равно нет.
#
# Если понадобится настоящая проверка раз в пять минут — её должен делать
# внешний сервис (UptimeRobot и подобные), а не Actions. Этот воркфлоу тогда
# останется вторым, независимым мнением, и это неплохо: он ходит с другой сети.
#
# Ещё одно ограничение GitHub: cron в репозитории, где 60 дней не было
# коммитов, отключается автоматически. Проект живой, но если наступит долгая
# пауза — проверку придётся включить руками в разделе Actions.

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

# Проверки не должны наслаиваться: при задержке раннера их может накопиться
# несколько, и тогда одно падение прода превратится в пачку одинаковых писем.
concurrency:
  group: monitoring
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    name: Живость sovenok.space
    runs-on: ubuntu-latest
    steps:
      # Корень НУЦ Минцифры лежит в репозитории. Пока домен на Let's Encrypt он
      # не нужен, но в README описан переход на сертификат, выпущенный НУЦ, — а
      # его системный CA-бандл раннера не знает. Без этого файла в день перехода
      # мониторинг начал бы кричать «прод лежит» о совершенно живом проде.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/russian-trusted-root-ca.pem
          sparse-checkout-cone-mode: false

      - name: Проверка
        id: check
        run: |
          HOST=sovenok.space
          CA=deploy/russian-trusted-root-ca.pem

          # Обёртка над curl. Сначала обычная проверка цепочки, и только если
          # curl ругнулся именно на сертификат (код выхода 60) — повтор с корнем
          # НУЦ. Порядок важен: --cacert ЗАМЕНЯЕТ бандл, а не дополняет его,
          # поэтому сразу ходить с ним нельзя — сломались бы Let's Encrypt.
          #
          # Каждый вызов curl обёрнут в `|| rc=$?`. Шаг выполняется с set -e, а
          # под ним список `A && B` роняет весь скрипт, стоит A вернуть не ноль,
          # — то есть первая же сетевая икота обрывала бы проверку вместо того,
          # чтобы стать поводом для следующей попытки.
          fetch () { # $1 — путь, $2 — code | body
            local out rc=0
            if [ "$2" = "code" ]; then
              out="$(curl -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOST$1" 2>/dev/null)" || rc=$?
            else
              out="$(curl -s --max-time 15 "https://$HOST$1" 2>/dev/null)" || rc=$?
            fi
            if [ "$rc" -eq 60 ] && [ -f "$CA" ]; then
              rc=0
              if [ "$2" = "code" ]; then
                out="$(curl -o /dev/null -w '%{http_code}' --max-time 15 --cacert "$CA" "https://$HOST$1" 2>/dev/null)" || rc=$?
              else
                out="$(curl -s --max-time 15 --cacert "$CA" "https://$HOST$1" 2>/dev/null)" || rc=$?
              fi
            fi
            printf '%s' "$out"
          }

          # Пять попыток с паузой: у раннеров бывают сетевые икоты, и будить
          # человека из-за одной оборванной попытки — верный способ научить его
          # не читать эти письма.
          reason=""
          for i in 1 2 3 4 5; do
            code="$(fetch / code)"
            if [ "$code" != "200" ]; then
              reason="страница отдала ${code:-нет ответа}"
              echo "попытка $i: $reason"
              sleep 15; continue
            fi

            # Одного 200 мало. Приложение, потерявшее переменные шлюза,
            # поднимается на пустой локальной SQLite и отвечает ровно так же:
            # сайт открывается, чужих аккаунтов и прогресса нет, а новые
            # регистрации пишутся мимо ночных бэкапов. Ручка отдаёт
            # "db":"postgres" только если приложение действительно
            # разговаривает с PostgreSQL — она спрашивает у самой базы.
            db="$(fetch /api/zdorovie body)"
            case "$db" in
              *'"ok":true'*'"db":"postgres"'*)
                echo "здоров на попытке $i"
                exit 0 ;;
            esac
            # Ответ уходит в reason, а reason — в GITHUB_OUTPUT, где значение
            # обязано быть однострочным: перевод строки в нём молча ломает файл
            # и следующий шаг получает мусор. Плюс за ручку может ответить не
            # ручка, а страница ошибки Caddy в килобайт — в письме и в телеграме
            # такое читать нечем. Отсюда одна строка и обрезка.
            short="$(printf '%s' "$db" | tr '\r\n' '  ' | cut -c1-120)"
            reason="страница жива, но база: ${short:-ручка не ответила}"
            echo "попытка $i: $reason"
            sleep 15
          done

          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "::error::Прод недоступен или подключён не к PostgreSQL — $reason"
          {
            echo "## Прод не отвечает"
            echo
            echo "Пять попыток за минуту, последняя причина: \`$reason\`"
            echo
            echo "Куда смотреть: \`ssh sovenok@158.160.175.29\`, затем"
            echo "\`docker compose ps\` и \`docker compose logs --tail=100 app\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Письмо о упавшем запуске GitHub присылает владельцу репозитория сам —
      # это канал по умолчанию, он работает без единого секрета. Телеграм ниже
      # включается, только если секреты заведены: письмо можно не увидеть до
      # утра, сообщение в телефоне — увидишь сразу.
      - name: Сообщить в Телеграм
        if: failure()
        env:
          TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "секреты для телеграма не заведены — оповещение только письмом"
            exit 0
          fi
          # --fail, чтобы сломанный токен не выглядел как успешно отправленное
          # оповещение: молчащий мониторинг хуже отсутствующего.
          curl -sS --fail --max-time 15 \
            "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=Совёнок: прод не отвечает.
          $REASON
          $RUN"
