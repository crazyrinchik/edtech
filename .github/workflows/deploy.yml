name: Deploy to production

# Пуш в main → проверки → сборка образов → выкладка на 158.160.175.29.
# Ручной запуск (workflow_dispatch) выкатывает текущий main тем же путём.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Две выкладки одновременно ходили бы в один docker compose на сервере.
# cancel-in-progress: false — начатую выкладку не рвём на середине.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/crazyrinchik/sovenok-app
  WEB_IMAGE: ghcr.io/crazyrinchik/sovenok-web
  GATEWAY_IMAGE: ghcr.io/crazyrinchik/sovenok-db-gateway
  DEPLOY_HOST: 158.160.175.29
  DEPLOY_USER: sovenok
  DEPLOY_DIR: /home/sovenok/edtech
  HEALTHCHECK_HOST: sovenok.space
  # Служебная ручка: отвечает, к какой базе подключено приложение
  # (app/src/lib/health.server.ts).
  HEALTHCHECK_DB_PATH: /api/zdorovie

jobs:
  # ── 1. Проверки: до сборки образов, чтобы не гонять её зря ───────────────
  check:
    name: Типы и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # Тесты вендоренных пакетов. quanta сюда не входит: 13 её файлов не
      # импортируются вне Nexus (приватный @higgsfield-ai/icons), это
      # состояние репозитория, а не регрессия — блокировать им выкладку нельзя.
      - name: Тесты fnf
        working-directory: app/packages/fnf
        run: bun run test
      - name: Тесты fnf-react
        working-directory: app/packages/fnf-react
        run: bun run test

      - name: Тесты quanta (справочно, не блокируют)
        working-directory: app/packages/quanta
        continue-on-error: true
        run: bun run test

  # ── 2. Сборка образов на раннере, не на проде ───────────────────────────
  # У сервера 2 ГБ ОЗУ: собирать там vite-бандл под живым трафиком не стоит.
  build:
    name: Сборка образов
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Тег образа
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Обе цели используют общую стадию build из Dockerfile, поэтому кеш
      # buildx между ними переиспользуется: bun install и vite build идут один раз.
      - name: SSR-worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha,scope=sovenok
          cache-to: type=gha,scope=sovenok,mode=max

      - name: Шлюз к PostgreSQL
        uses: docker/build-push-action@v7
        with:
          context: .
          target: db-gateway
          push: true
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.GATEWAY_IMAGE }}:latest
          cache-from: type=gha,scope=sovenok
          cache-to: type=gha,scope=sovenok,mode=max

      - name: Caddy со статикой
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=sovenok
          cache-to: type=gha,scope=sovenok,mode=max

  # ── 3. Выкладка: сервер только скачивает готовые образы ─────────────────
  deploy:
    name: Выкладка на прод
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://sovenok.space
    steps:
      - uses: actions/checkout@v7

      - name: Ключ и отпечаток сервера
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Отпечаток закреплён в репозитории, а не берётся из сети:
          # ssh-keyscan на лету принял бы подменённый хост молча.
          echo "158.160.175.29 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILuYsIYvKps/xisoXi4nny2DskJVJEsO4qOdtGi6W7DH" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Единственный файл, который живёт на сервере: сам код туда не едет,
      # он уже внутри образов.
      - name: Обновить docker-compose.yml на сервере
        run: |
          scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.yml"

      - name: Переключить прод на новый тег
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_DIR"

          PREV_TAG="\$(sed -n 's/^IMAGE_TAG=//p' .env 2>/dev/null || true)"
          NEW_TAG='${{ needs.build.outputs.image_tag }}'
          echo "было: \${PREV_TAG:-<нет>}, станет: \$NEW_TAG"

          # Меняем только строку IMAGE_TAG. Перезапись файла целиком снесла бы
          # POSTGRES_PASSWORD и GATEWAY_TOKEN — база бы просто не поднялась.
          set_tag() {
            touch .env
            grep -v '^IMAGE_TAG=' .env > .env.new || true
            echo "IMAGE_TAG=\$1" >> .env.new
            mv .env.new .env
          }

          # Токен живёт только на время этого workflow — постоянного пароля
          # от реестра на сервере не остаётся. trap на случай выхода по set -e.
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # Чистка стоит ДО загрузки, а не после. Раньше она была в самом конце,
          # после проверки живости — то есть после шага, которому и не хватало
          # места. Диск 12 ГБ, образ app весит ~700 МБ, десяток выкладок за день
          # забивал его под завязку, pull падал, и чистка уже не запускалась.
          # Образы работающих контейнеров docker не трогает, поэтому откат
          # на предыдущий тег остаётся возможен.
          docker image prune -af --filter 'until=24h' >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

          # Сначала скачиваем — и только потом переписываем .env. Иначе упавший
          # pull оставил бы на сервере тег, которого нет: контейнеры продолжают
          # работать, но следующий ручной `up -d` сломался бы на пустом месте.
          IMAGE_TAG="\$NEW_TAG" docker compose pull
          set_tag "\$NEW_TAG"
          docker compose up -d --no-build --remove-orphans

          # Проверка живости через тот же TLS-путь, которым ходят пользователи,
          # но резолвом в петлю — не зависим от внешней сети.
          #
          # Одного 200 с "/" мало: приложение, потерявшее переменные шлюза,
          # раньше поднималось на пустой локальной SQLite и отвечало ровно так
          # же — сайт живой, аккаунтов и прогресса нет, регистрации уходят мимо
          # бэкапов. Поэтому вторым запросом спрашиваем /api/zdorovie: ручка
          # отдаёт 200 и {"ok":true,"db":"postgres"} только если приложение
          # действительно разговаривает с PostgreSQL (проверено запросом к самой
          # базе, а не чтением переменной). Данных ручка не раскрывает.
          # Сертификат, выпущенный не Let's Encrypt, а руками (НУЦ Минцифры),
          # системный CA-бандл сервера не знает: curl ниже вернул бы exit 60 и
          # код 000, проверка сочла бы живой прод мёртвым и откатила выкладку.
          # Поэтому, если сертификат подменён (certs/ca.pem положен рядом с
          # ним), проверяем цепочку по его корню. Файла нет — обычный Let's
          # Encrypt и обычная проверка по системному бандлу. Заменять на -k
          # нельзя: тогда сломанный TLS перестал бы отличаться от рабочего.
          CA_OPT=""
          if [ -s certs/ca.pem ]; then
            CA_OPT="--cacert certs/ca.pem"
            echo "проверка живости — по корню из certs/ca.pem"
          fi

          healthy=0
          for i in \$(seq 1 20); do
            code="\$(curl -s \$CA_OPT -o /dev/null -w '%{http_code}' --max-time 10 \\
              --resolve "$HEALTHCHECK_HOST:443:127.0.0.1" \\
              "https://$HEALTHCHECK_HOST/" || true)"
            if [ "\$code" != "200" ]; then
              echo "попытка \$i: страница отдала \$code"
              sleep 3
              continue
            fi

            db="\$(curl -s \$CA_OPT --max-time 10 \\
              --resolve "$HEALTHCHECK_HOST:443:127.0.0.1" \\
              "https://$HEALTHCHECK_HOST$HEALTHCHECK_DB_PATH" || true)"
            case "\$db" in
              *'"ok":true'*'"db":"postgres"'*)
                healthy=1; echo "здоров на попытке \$i: \$db"; break ;;
            esac
            echo "попытка \$i: страница 200, но база — \${db:-<ручка не ответила>}"
            sleep 3
          done

          if [ "\$healthy" != "1" ]; then
            echo "::error::после выкладки прод либо не отвечает, либо подключён не к PostgreSQL"
            if [ -n "\$PREV_TAG" ]; then
              echo "откатываюсь на \$PREV_TAG"
              set_tag "\$PREV_TAG"
              docker compose up -d --no-build
            fi
            exit 1
          fi

          docker compose ps --format 'table {{.Name}}\t{{.Status}}'
          REMOTE

      - name: Итог
        run: echo "https://sovenok.space — тег ${{ needs.build.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
